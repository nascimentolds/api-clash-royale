name: API CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (Estilo)
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4
      - name: Prepara o Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Instala dependencias
        run: npm ci
      - name: Roda o lint
        run: npm run lint

  test-and-coverage:
    name: Teste & Cobertura (90%)
    runs-on: ubuntu-latest
    needs: lint 
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4
      - name: Prepara o Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Instala dependencias
        run: npm ci
      - name: Roda os testes
        run: npm test

  # Cria a imagem docker
  build-image:
    name: Construir Imagem
    runs-on: ubuntu-latest
    needs: test-and-coverage
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4
      
      - name: Loga no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepara o construtor do docker
        uses: docker/setup-buildx-action@v3

      - name: Cria a imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-clash-royale:latest

  # Manda a imagem pro Docker Hub
  publish-image:
    name: Publicar Imagem
    runs-on: ubuntu-latest
    needs: build-image 
    if: github.ref == 'refs/heads/main' 
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4

      - name: Loga no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepara o construtor
        uses: docker/setup-buildx-action@v3

      - name: Envia pro Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-clash-royale:latest